name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Static analysis
        run: uv run bandit -r applai_mcp -ll -ii -q

      - name: Dependency vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/mcp-requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/mcp-requirements.txt" --disable-pip

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: pip install "pip-audit==2.7.*" "bandit==1.7.*" "detect-secrets==1.4.*"

      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Static analysis
        run: bandit -r src -ll -ii -q

      - name: Secrets (new findings vs .secrets.baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
