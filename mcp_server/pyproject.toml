[project]
name = "applai-mcp"
version = "0.1.0"
description = "MCP server exposing ApplAI job scoring, generation and application tracking"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
applai-mcp = "applai_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["applai_mcp"]

[tool.uv]
# Supply-chain guard: ignore releases newer than this date (bump deliberately)
exclude-newer = "2026-10-16T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
