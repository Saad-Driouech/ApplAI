# Remote host stack (see deploy/README.md). Layered on the base file, which the local setup keeps using unchanged:
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d --build
# Adds the MCP connector, Caddy (public TLS edge) and Syncthing. n8n doesn't run here (profile "n8n");
# a Claude scheduled task drives the pipeline through the connector instead.

services:

  n8n:
    profiles: ["n8n"]

  # ── MCP server over HTTP (claude.ai connector) ──────────────────────────
  mcp:
    build: ./mcp_server
    container_name: applai-mcp
    restart: unless-stopped
    expose:
      - "8080"                          # only Caddy reaches it
    env_file:
      - mcp_server/.env
    environment:
      - APPLAI_API_URL=http://applai-api:8000
      - APPLAI_APPLICATIONS_DIR=/mnt/job_applications
      - CONFIRMATION_MODE=token         # scheduled tasks can't answer elicitation
    volumes:
      - ${APPLAI_WORKING_DIR}:/mnt/job_applications:ro
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - applai-api
    networks:
      - applai-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ── TLS edge: mcp.<domain> and hooks.<domain> ───────────────────────────
  caddy:
    image: caddy:2.11.6-alpine
    container_name: applai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                   # HTTP/3
    environment:
      - MCP_ALLOWED_CIDRS=${MCP_ALLOWED_CIDRS:-0.0.0.0/0 ::/0}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                # certificates
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mcp
      - applai-api
    networks:
      - applai-net

  # ── Folder sync with your computer, over the tailnet only ───────────────
  syncthing:
    image: syncthing/syncthing:2.1.6
    container_name: applai-syncthing
    hostname: applai-host
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:22000:22000/tcp"
      - "${TAILSCALE_IP}:22000:22000/udp"
      - "127.0.0.1:8384:8384"           # GUI: ssh -N -L 18384:127.0.0.1:8384 over the tailnet
    volumes:
      # The image hands only its home (/var/syncthing) to PUID; the config lives inside it
      - syncthing_home:/var/syncthing
      - ${APPLAI_WORKING_DIR}:/var/syncthing/job_applications
      - ${APPLAI_BACKUP_DIR:-/srv/applai/backups}:/var/syncthing/backups
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  syncthing_home:
